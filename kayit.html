<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ücretsiz Kayıt | SEO Haberci AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#18212f}.wrap{max-width:520px;margin:70px auto;padding:24px}.card{background:#fff;border:1px solid #dce3ec;border-radius:20px;padding:28px;box-shadow:0 15px 45px #0001}h1{margin-top:0;color:#0f1f3d}p{color:#6d7684}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #dce3ec;border-radius:10px;font-size:16px}button,.btn{display:inline-block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#183b73;color:white;font-weight:800;text-decoration:none;text-align:center;cursor:pointer}.muted{text-align:center;margin-top:16px}.error{color:#b42318;margin-top:12px}.ok{color:#067647;margin-top:12px}</style></head><body><div class="wrap"><div class="card"><h1>Ücretsiz Kayıt</h1><p>3 ücretsiz haber hakkıyla başla.</p><form id="f"><label>E-posta</label><input id="email" type="email" required autocomplete="email"><label>Şifre</label><input id="password" type="password" required minlength="8" autocomplete="new-password"><button>Ücretsiz Kayıt</button><div id="msg"></div></form><div class="muted"><a href="/giris.html">Zaten hesabın var mı? Giriş yap</a></div></div></div><script>document.getElementById('f').addEventListener('submit',async(e)=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='İşleniyor...';msg.className='';const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'İşlem başarısız.';msg.className='error';return;}msg.textContent='Başarılı, yönlendiriliyorsunuz...';msg.className='ok';setTimeout(()=>location.href=new URLSearchParams(location.search).get('next')||'/',500);});</script></body></html>
